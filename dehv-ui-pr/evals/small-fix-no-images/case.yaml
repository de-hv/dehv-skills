schema_version: "1.1"
name: small-fix-no-images
expected_outcome: |
  On fix/BILL-9/... with an uncommitted logic-only fix, the run detects GitLab, sees there is no
  visible UI change and asks whether images are wanted (answer: no), makes no images, proposes a
  commit message with BILL-9 without committing, and writes a PR title and body in the default
  structure (Summary, Changes, How to test) because the repo has no template.
context:
  scaffold_script: place-files.sh
